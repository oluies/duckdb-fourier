name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist is self-contained (no CDN / external URLs)
        run: |
          # Keep in sync with the same step in ci.yml. Anchor on an actual URL, not a
          # bare token: matching the bare words false-positives on npm package.json
          # metadata, since duckdb-wasm declares `jsdelivr` and `unpkg` entry-point
          # fields whose values are RELATIVE paths ("dist/duckdb-browser.cjs"). Vite 8
          # inlines that metadata; Vite 5 stripped it, so the token match passed by luck.
          #
          # `(https?:)?//` also catches protocol-relative URLs ("//unpkg.com/..."),
          # and -n (not -l) prints the offending line instead of only the file name.
          cdn_url="(https?:)?//[^[:space:]\"'\`]*(jsdelivr|unpkg|googleapis|gstatic)"
          if grep -rEn "$cdn_url" dist/assets/*.js dist/index.html; then
            echo "::error::Built assets load from an external CDN; refusing to deploy (see match above)"
            exit 1
          fi
          echo "dist/ is self-contained — no external CDN URLs in JS/HTML"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
