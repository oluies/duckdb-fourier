name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist is self-contained (no CDN / external URLs)
        run: |
          # Anchor on an actual URL, not a bare token. Matching the bare words
          # false-positives on npm package.json metadata: duckdb-wasm declares
          # `jsdelivr` and `unpkg` entry-point fields whose values are RELATIVE
          # paths ("dist/duckdb-browser.cjs"), and from Vite 8 on that metadata is
          # inlined into the bundle. Vite 5 stripped it, so the old check passed by
          # luck rather than by being right.
          #
          # `(https?:)?//` also catches protocol-relative URLs ("//unpkg.com/..."),
          # which the token match happened to catch and a naive "https://" would not.
          #
          # -n (not -l) so a genuine hit prints the offending line: the old check
          # only named the file, which made it needlessly hard to diagnose.
          cdn_url="(https?:)?//[^[:space:]\"'\`]*(jsdelivr|unpkg|googleapis|gstatic)"
          if grep -rEn "$cdn_url" dist/assets/*.js dist/index.html; then
            echo "::error::Built assets load from an external CDN (see match above)"
            exit 1
          fi
          echo "dist/ is self-contained — no external CDN URLs in JS/HTML"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
