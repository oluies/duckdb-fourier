version: 2
updates:
  # JavaScript dependencies (Vite, duckdb-wasm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine dev-tooling bumps into one PR to cut noise.
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
